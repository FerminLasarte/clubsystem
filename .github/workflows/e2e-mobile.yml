name: E2E mobile (Maestro)

# Smoke de la app del socio en un simulador de iOS (docs/e2e.md). No corre en cada PR:
# tarda ~30-40 min por el build de Xcode. Se lanza a mano (Actions → Run workflow) o cada noche.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *" # 03:00 en Argentina

concurrency:
  group: e2e-mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 75
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://clubsystem_app:app@localhost:5432/clubsystem_test
      TEST_MIGRATIONS_DATABASE_URL: postgresql+asyncpg://clubsystem_owner:owner@localhost:5432/clubsystem_test
      E2E_OUTPUT_DIR: ${{ github.workspace }}/maestro-output
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          # macos-26 no trae Xcode 27; solo lo tiene la imagen `xcode-27`, en preview (ver docs/e2e.md).
          xcode-version: "26"
      - name: Postgres
        # Los runners de macOS no tienen Docker: Postgres de Homebrew (superusuario = el usuario del runner).
        run: |
          brew install postgresql@17
          brew services start postgresql@17
          PG="$(brew --prefix postgresql@17)/bin"
          for _ in $(seq 30); do "$PG/pg_isready" -h localhost && break; sleep 1; done
          "$PG/psql" -h localhost -d postgres -f backend/docker/init-db.sql
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pipx install poetry
      - run: poetry install --no-interaction
        working-directory: backend
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Maestro
        run: brew install mobile-dev-inc/tap/maestro
      - name: E2E de la app
        run: apps/mobile/e2e/run-ios.sh
      - name: Capturas y logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-output
          path: |
            maestro-output
            apps/mobile/e2e/api.log
          retention-days: 7
