[tool.poetry]
name = "clubsystem-api"
version = "0.2.0"
description = "ClubSystem FastAPI backend"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<3.14"
fastapi = "^0.142.2"
uvicorn = { extras = ["standard"], version = "^0.54.0" }
sqlalchemy = { extras = ["asyncio"], version = "^2.1.3" }
asyncpg = "^0.31.0"
alembic = "^1.20.0"
pydantic = { extras = ["email"], version = "^2.13.5" }
pydantic-settings = "^2.15.0"
pyjwt = "^2.15.1"
bcrypt = "^5.0.0"
anthropic = "^1.11.0"
slowapi = "^0.1.10"

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
pytest-asyncio = "^1.4.0"
httpx = "^0.28.1"
ruff = "^0.16.10"
pyright = "^1.1.414"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "DTZ", "ASYNC", "S", "RUF"]
ignore = [
  "B008",   # Depends(...) en defaults es el patrón de FastAPI
  "S101",   # assert en tests
  "RUF001", "RUF002", "RUF003",  # textos en español con caracteres ambiguos
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S603", "DTZ001", "DTZ005", "DTZ011"]
"scripts/**" = ["S105", "S106"]
"app/domain/enums.py" = ["S105"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-ra"

[tool.pyright]
include = ["app", "tests", "scripts"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
